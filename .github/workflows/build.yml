name: Build CheatEngine.Mcp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.401"
      - name: Restore
        run: dotnet restore CheatEngine.Mcp.slnx --locked-mode
      - name: Build Debug
        run: dotnet build CheatEngine.Mcp.slnx --no-restore
      - name: Test Debug
        run: dotnet test --solution CheatEngine.Mcp.slnx --no-restore --no-build --filter-not-trait Category=LiveQualification --filter-not-trait Category=NativeLua --fail-skips on
      - name: Check formatting
        run: |
          dotnet format style CheatEngine.Mcp.slnx --no-restore --severity warn --verify-no-changes
          dotnet format whitespace CheatEngine.Mcp.slnx --no-restore --verify-no-changes
      - name: Build Release
        run: dotnet build CheatEngine.Mcp.slnx -c Release --no-restore
      - name: Test Release
        run: dotnet test --solution CheatEngine.Mcp.slnx -c Release --no-restore --no-build --filter-not-trait Category=LiveQualification --filter-not-trait Category=NativeLua --fail-skips on
      - name: Publish Debug distribution
        run: pwsh -NoProfile -File eng/Publish.ps1 -Configuration Debug
      - name: Publish Release distribution
        run: pwsh -NoProfile -File eng/Publish.ps1 -Configuration Release
      - name: Package release assets
        run: pwsh -NoProfile -File eng/Release.ps1 -DistributionPath artifacts/dist/release
      - name: Upload Debug distribution
        uses: actions/upload-artifact@v7.0.1
        with:
          name: CheatEngine.Mcp-debug
          path: artifacts/dist/debug/**
          if-no-files-found: error
      - name: Upload Release distribution
        uses: actions/upload-artifact@v7.0.1
        with:
          name: CheatEngine.Mcp-release
          path: artifacts/dist/release/**
          if-no-files-found: error
      - name: Upload release assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: CheatEngine.Mcp-release-assets
          path: artifacts/releases/**
          if-no-files-found: error
